<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ماسح الأصول والمستودع</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://unpkg.com/html5-qrcode"></script>
    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
    <style>
        body { background-color: #f4f6f9; font-family: system-ui, -apple-system, sans-serif; }
        #reader { width: 100%; max-width: 500px; margin: auto; border-radius: 12px; overflow: hidden; border: 3px solid #0d6efd; }
    </style>
</head>
<body>

<div class="container py-4" style="max-width: 700px;">
    <h3 class="text-center mb-3 text-primary">ماسح جرد الأصول</h3>

    <div class="card p-3 mb-3 text-center">
        <div id="connectionStatus" class="alert alert-info m-0">جاري الاتصال بـ Google Sheets...</div>
    </div>

    <!-- الكاميرا تعمل تلقائياً للوجوه والمسح -->
    <div class="card p-3 mb-3 text-center">
        <div id="reader"></div>
        <p class="text-muted mt-2 small">وجه الكاميرا مباشرة نحو الباركود المطبوع</p>
    </div>

    <div id="resultCard" class="card p-4 shadow-sm" style="display: none;">
        <div class="text-center mb-3"><svg id="barcodeCanvas"></svg></div>
        <h5 class="text-primary border-bottom pb-2">تفاصيل الأصل</h5>
        <div id="assetDetails"></div>
        <button onclick="restartCamera()" class="btn btn-success mt-3 w-100">مسح أصل آخر</button>
    </div>
</div>

<script>
    const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwYBvXPSzfHifbPATuPifxJEtBLLqin8adHznx1DIrtRGGLyVT-tOYhMFjEhE624fMB/exec';
    let excelData = [];
    let html5QrCode = null;

    window.addEventListener('DOMContentLoaded', () => {
        fetch(APPS_SCRIPT_URL)
            .then(res => res.json())
            .then(rawData => {
                const headers = rawData[0];
                excelData = rawData.slice(1).map(row => {
                    let obj = {};
                    headers.forEach((h, i) => obj[h] = row[i]);
                    return obj;
                });
                document.getElementById('connectionStatus').className = "alert alert-success m-0";
                document.getElementById('connectionStatus').innerHTML = `جاهز! تم تحميل <strong>${excelData.length}</strong> أصل.`;
                startScanner();
            });
    });

    function startScanner() {
        html5QrCode = new Html5Qrcode("reader");
        html5QrCode.start(
            { facingMode: "environment" }, 
            { fps: 30, qrbox: { width: 300, height: 150 } },
            (decodedText) => {
                html5QrCode.stop().then(() => findAndDisplayAsset(decodedText));
            },
            (err) => {}
        );
    }

    function restartCamera() {
        document.getElementById('resultCard').style.display = 'none';
        startScanner();
    }

    function findAndDisplayAsset(scannedCode) {
        const cleanScanned = String(scannedCode).replace(/[*]/g, '').trim().toUpperCase();

        const asset = excelData.find(row => {
            const c = String(row['Code'] || '').replace(/[*]/g, '').trim().toUpperCase();
            const b = String(row['Barcode'] || '').replace(/[*]/g, '').trim().toUpperCase();
            return c === cleanScanned || b === cleanScanned;
        });

        if (asset) {
            try { JsBarcode("#barcodeCanvas", cleanScanned, { format: "CODE128", width: 2, height: 40 }); } catch(e){}
            document.getElementById('assetDetails').innerHTML = `
                <table class="table table-bordered mt-2">
                    <tr><th>الكود:</th><td><strong>${asset['Code'] || '-'}</strong></td></tr>
                    <tr><th>الوصف:</th><td>${asset['الوصف / Description'] || '-'}</td></tr>
                    <tr><th>التصنيف:</th><td>${asset['الوصف العام / Category'] || '-'}</td></tr>
                    <tr><th>الماركة:</th><td>${asset['المصنع / Manufacturer / Brand'] || '-'}</td></tr>
                    <tr><th>الموديل:</th><td>${asset['الموديل / Model'] || '-'}</td></tr>
                    <tr><th>الرقم التسلسلي:</th><td>${asset['الرقم التسلسلي / Serial Number'] || '-'}</td></tr>
                    <tr><th>الموقع:</th><td>${asset['الموقع / Location'] || ''} - ${asset['مكتب / Office'] || ''}</td></tr>
                    <tr><th>المستلم:</th><td>${asset['الاسم / Name'] || '-'}</td></tr>
                    <tr><th>الحالة:</th><td><span class="badge bg-success">${asset['الحالة عند الفحص / Condition'] || '-'}</span></td></tr>
                </table>`;
        } else {
            document.getElementById('assetDetails').innerHTML = `<div class="alert alert-danger">الكود الممسوح (${cleanScanned}) غير موجود بالجدول.</div>`;
        }
        document.getElementById('resultCard').style.display = 'block';
    }
</script>
</body>
</html>
